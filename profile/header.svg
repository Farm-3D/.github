<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" fill="none" role="img" aria-label="Farm-3D — L'impression 3D grand format, déployée là où on en a besoin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#404436"/>
      <stop offset="0.55" stop-color="#4d5142"/>
      <stop offset="1" stop-color="#5b604e"/>
    </linearGradient>
    <clipPath id="frame"><rect width="840" height="190" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="840" height="190" fill="url(#bg)"/>

    <!-- Additive manufacturing builds in stacked layers, so the banner does
         too: the lines thin out as they rise, the way a deposition fades. -->
    <g stroke="#6f7d3f">
      <path d="M0 160h840" opacity="0.30"/>
      <path d="M0 151h840" opacity="0.26"/>
      <path d="M0 142h840" opacity="0.22"/>
      <path d="M0 133h840" opacity="0.18"/>
      <path d="M0 124h840" opacity="0.14"/>
      <path d="M0 115h840" opacity="0.10"/>
      <path d="M0 106h840" opacity="0.07"/>
    </g>

    <path d="M0 169h840" stroke="#869653" stroke-width="1.5" opacity="0.55"/>

    <text x="56" y="82" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="600" letter-spacing="-1" fill="#f2f1e4">Farm-3D</text>

    <text x="58" y="114" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#d2d1bd" letter-spacing="0.2">L'impression 3D grand format, déployée là où on en a besoin.</text>

    <rect x="58" y="134" width="26" height="2" fill="#869653" opacity="0.85"/>

    <rect x="0.5" y="0.5" width="839" height="189" rx="10" stroke="#6a6c5c" stroke-opacity="0.5"/>
  </g>
</svg>
