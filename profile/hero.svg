<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" fill="none" role="img">
  <title>Farm-3D — L'impression 3D grand format, déployée là où on en a besoin</title>

  <defs>
    <!-- --navy #404436 / --navy2 #4d5142 / --navy3 #5b604e, verbatim from
         src/styles.css. No external font: GitHub sandboxes SVGs with
         `default-src 'none'`, which killed the previous Inter reference and
         made the whole card fall back to alt text. -->
    <linearGradient id="h" x1="0" y1="0" x2="900" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#404436"/>
      <stop offset="0.6" stop-color="#4d5142"/>
      <stop offset="1" stop-color="#5b604e"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="176" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="900" height="176" fill="url(#h)"/>

    <!-- Deposition layers: additive manufacturing builds upward, fading. -->
    <g stroke="#6f7d3f">
      <path d="M0 168h900" opacity="0.30"/>
      <path d="M0 158h900" opacity="0.25"/>
      <path d="M0 148h900" opacity="0.20"/>
      <path d="M0 138h900" opacity="0.15"/>
      <path d="M0 128h900" opacity="0.10"/>
      <path d="M0 118h900" opacity="0.06"/>
    </g>

    <text x="60" y="80" font-family="sans-serif" font-size="46" font-weight="bold" letter-spacing="-1.2" fill="#f2f1e4">Farm-3D</text>
    <rect x="62" y="98" width="34" height="3" rx="1.5" fill="#869653"/>
    <text x="60" y="131" font-family="sans-serif" font-size="16" fill="#d2d1bd">L'impression 3D grand format, déployée là où on en a besoin.</text>

    <rect x="0.5" y="0.5" width="899" height="175" rx="10" stroke="#6a6c5c" stroke-opacity="0.5"/>
  </g>
</svg>
