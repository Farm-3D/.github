<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none" role="img" aria-label="DMEOS et ATMN, les deux systèmes de Farm-3D — farm-3d.com">
  <defs>
    <!-- Sampled from assets/farm3d-logo.png: the mark sits on a sand khaki,
         not the darker green the site chrome uses. The footer follows the
         logo so the two read as the same brand. -->
    <linearGradient id="fbg" x1="0" y1="0" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6b6a0"/>
      <stop offset="1" stop-color="#a5a68e"/>
    </linearGradient>
    <clipPath id="fframe"><rect width="840" height="230" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#fframe)">
    <rect width="840" height="230" fill="url(#fbg)"/>

    <!-- Deposition layers, mirrored from the header but dark-on-light here. -->
    <g stroke="#404436">
      <path d="M0 214h840" opacity="0.16"/>
      <path d="M0 205h840" opacity="0.13"/>
      <path d="M0 196h840" opacity="0.10"/>
      <path d="M0 187h840" opacity="0.07"/>
      <path d="M0 178h840" opacity="0.05"/>
    </g>

    <path d="M0 3h840" stroke="#404436" stroke-width="3" opacity="0.55"/>

    <text x="56" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#5b604e">NOS SYSTÈMES</text>

    <!-- Two marks, two roles: DMEOS runs the production, ATMN houses it. -->
    <g>
      <rect x="56" y="66" width="3" height="72" fill="#404436" opacity="0.75"/>
      <text x="74" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="0.4" fill="#2b2c24">DMEOS<tspan font-size="11" baseline-shift="super" fill="#5b604e">®</tspan></text>
      <text x="74" y="111" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#41443a">Le système d'exécution de la production</text>
      <text x="74" y="131" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5f6154">Supervision · Traçabilité · Souveraineté de la donnée</text>
    </g>

    <g>
      <rect x="446" y="66" width="3" height="72" fill="#404436" opacity="0.75"/>
      <text x="464" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="0.4" fill="#2b2c24">ATMN<tspan font-size="11" baseline-shift="super" fill="#5b604e">™</tspan></text>
      <text x="464" y="111" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#41443a">L'Atelier Mobile Numérique 4.0</text>
      <text x="464" y="131" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5f6154">Conteneur ISO · 10 à 40 pieds · ISO/ASTM 52920</text>
    </g>

    <path d="M56 164h728" stroke="#404436" stroke-opacity="0.22"/>

    <text x="56" y="192" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2b2c24">farm-3d.com</text>

    <text x="784" y="192" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6154">DMEOS® et ATMN™ sont des marques de Farm-3D</text>

    <rect x="0.5" y="0.5" width="839" height="229" rx="10" stroke="#8b8c76" stroke-opacity="0.6"/>
  </g>
</svg>
