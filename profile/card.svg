<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" fill="none" role="img" aria-label="Farm-3D — L'impression 3D grand format, déployée là où on en a besoin. DMEOS et ATMN. farm-3d.com">
  <title>Farm-3D</title>

  <defs>
    <!-- Exact variables from src/styles.css so the profile and the site can
         never drift: --navy #404436, --bg #f2f1e4, --ink #2b2c24,
         --accent #6f7d3f, --accent2 #869653, --muted #6f705f. -->
    <linearGradient id="hero" x1="0" y1="0" x2="900" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#404436"/>
      <stop offset="0.6" stop-color="#4d5142"/>
      <stop offset="1" stop-color="#5b604e"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="560" rx="14"/></clipPath>
    <clipPath id="heroClip"><path d="M0 14a14 14 0 0 1 14-14h872a14 14 0 0 1 14 14v216H0z"/></clipPath>
  </defs>

  <g clip-path="url(#card)">

    <!-- ── Page surface: --bg, the site's cream ───────────────────────── -->
    <rect width="900" height="560" fill="#f2f1e4"/>

    <!-- ── Hero: --navy, the site's header ────────────────────────────── -->
    <g clip-path="url(#heroClip)">
      <rect width="900" height="230" fill="url(#hero)"/>

      <!-- Additive manufacturing builds in stacked layers; the deposition
           fades as it rises, so the opacity does too. -->
      <g stroke="#6f7d3f">
        <path d="M0 222h900" opacity="0.30"/>
        <path d="M0 212h900" opacity="0.25"/>
        <path d="M0 202h900" opacity="0.20"/>
        <path d="M0 192h900" opacity="0.15"/>
        <path d="M0 182h900" opacity="0.11"/>
        <path d="M0 172h900" opacity="0.07"/>
        <path d="M0 162h900" opacity="0.04"/>
      </g>

      <text x="64" y="92" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="-1.4" fill="#f2f1e4">Farm-3D</text>

      <rect x="66" y="110" width="34" height="3" rx="1.5" fill="#869653"/>

      <text x="64" y="146" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="17" fill="#d2d1bd">L'impression 3D grand format, déployée là où on en a besoin.</text>

      <!-- CTA, styled as the site's .btn -->
      <g>
        <rect x="64" y="168" width="184" height="38" rx="6" fill="#6f7d3f"/>
        <text x="86" y="192.5" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="0.2" fill="#f2f1e4">Découvrir farm-3d.com</text>
        <path d="M222 187.5h10m-4-4 4 4-4 4" stroke="#f2f1e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <path d="M0 230h900" stroke="#869653" stroke-width="3"/>

    <!-- ── Body copy ──────────────────────────────────────────────────── -->
    <text font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="15" fill="#2b2c24">
      <tspan x="64" y="276">Farm-3D conçoit et opère des ateliers de fabrication additive grand format — des unités</tspan>
      <tspan x="64" y="300">mobiles autonomes, installées sur site, qui produisent au plus près du besoin plutôt qu'à</tspan>
      <tspan x="64" y="324">l'autre bout d'une chaîne logistique.</tspan>
    </text>

    <text x="64" y="356" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="15" font-style="italic" fill="#6f705f">Nos machines travaillent en atelier comme en extérieur, par tous les temps.</text>

    <!-- ── Two cards, styled as the site's surfaces (--white on --bg) ──── -->
    <g>
      <rect x="64" y="386" width="376" height="104" rx="10" fill="#fbfaf2" stroke="#e2ddcd"/>
      <rect x="64" y="386" width="4" height="104" rx="2" fill="#6f7d3f"/>
      <text x="90" y="418" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="19" font-weight="700" fill="#2b2c24">DMEOS<tspan font-size="10" baseline-shift="super" fill="#6f7d3f">®</tspan></text>
      <text x="90" y="441" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="13" fill="#41443a">Le système d'exécution de la production</text>
      <text x="90" y="464" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="11.5" fill="#6f705f">Supervision · Traçabilité · Souveraineté de la donnée</text>
    </g>

    <g>
      <rect x="460" y="386" width="376" height="104" rx="10" fill="#fbfaf2" stroke="#e2ddcd"/>
      <rect x="460" y="386" width="4" height="104" rx="2" fill="#6f7d3f"/>
      <text x="486" y="418" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="19" font-weight="700" fill="#2b2c24">ATMN<tspan font-size="10" baseline-shift="super" fill="#6f7d3f">™</tspan></text>
      <text x="486" y="441" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="13" fill="#41443a">L'Atelier Mobile Numérique 4.0</text>
      <text x="486" y="464" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="11.5" fill="#6f705f">Conteneur ISO · 10 à 40 pieds · ISO/ASTM 52920</text>
    </g>

    <!-- ── Footer strip: --navy again, closing the card ────────────────── -->
    <rect y="512" width="900" height="48" fill="#404436"/>
    <text x="64" y="541" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f2f1e4">farm-3d.com</text>
    <text x="836" y="541" text-anchor="end" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="11" fill="#a8aa96">DMEOS® et ATMN™ sont des marques de Farm-3D</text>

    <rect x="0.5" y="0.5" width="899" height="559" rx="14" stroke="#e2ddcd"/>
  </g>
</svg>
